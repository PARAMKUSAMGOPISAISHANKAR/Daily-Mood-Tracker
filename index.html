<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Mood Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="wrap">

  <header>
    <div>
      <p class="brand-eyebrow">Daily check-in</p>
      <h1>How are you feeling today?</h1>
    </div>
    <button id="theme-toggle" aria-label="Toggle dark mode">
      <span class="knob">☀️</span>
    </button>
  </header>

  <!-- card 1 spans full width, cards 2 & 3 sit below it -->
  <div class="cards-grid">

    <section class="card wide-card">
      <p class="card-label">Log your mood</p>
      <p class="card-title">Pick what fits right now</p>
      <div class="mood-grid" id="mood-grid"></div>
      <div class="pager">
        <button class="pager-btn" id="mood-prev">Back</button>
        <div class="pager-dots" id="mood-dots"></div>
        <button class="pager-btn" id="mood-next">Next</button>
      </div>
    </section>

    <section class="card compact-card" id="now-card">
      <p class="card-label" style="align-self:flex-start;">Right now</p>
      <div id="now-content" style="display:flex;flex-direction:column;align-items:center;">
        <p id="now-empty">Nothing logged yet today — tap a mood to get started.</p>
      </div>
    </section>

    <section class="card compact-card">
      <p class="card-label">Dashboard</p>
      <p class="card-title">Your patterns</p>

      <div class="stat-row">
        <div class="stat-tile">
          <div class="stat-num" id="stat-total">0</div>
          <div class="stat-cap">Total check-ins</div>
        </div>
        <div class="stat-tile">
          <div class="stat-num" id="stat-top">—</div>
          <div class="stat-cap">Most frequent mood</div>
        </div>
      </div>

      <div id="dash-list"></div>
      <div class="pager">
        <button class="pager-btn" id="dash-prev">Back</button>
        <div class="pager-dots" id="dash-dots"></div>
        <button class="pager-btn" id="dash-next">Next</button>
      </div>

      <button class="reset-btn" id="reset-btn">Clear history</button>
    </section>

  </div>


</div>

<script src="script.js"></script>


</body>
</html>
