<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Mood Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>How are you feeling today?</h1>
        <div class="mood-selection">
            <button class="mood-button" data-mood="happy" data-color="#fff9c4" data-emoji="😊">😊</button>
            <button class="mood-button" data-mood="sad" data-color="#bbdefb" data-emoji="😢">😢</button>
            <button class="mood-button" data-mood="excited" data-color="#ffcdd2" data-emoji="🤩" >🤩</button>
            <button class="mood-button" data-mood="calm" data-color="#c8e6c9" data-emoji="😌">😌</button>
        </div>
        <div class="mood-history">
            <h2>Mood History</h2>
            <ul id="mood-list"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
